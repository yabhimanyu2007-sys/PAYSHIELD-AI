<!doctype html><html><head><meta charset="utf-8"><title>PAYSHIELD payment confirmation</title><link rel="stylesheet" href="/static/style.css"></head><body style="padding:40px"><h1>PayPal approval received</h1><p id="status">Verifying and capturing the approved Sandbox order…</p><a href="/">Return to PAYSHIELD</a><script>const token=new URLSearchParams(location.search).get("token");const out=document.getElementById("status");if(!token){out.textContent="No PayPal order token was returned. Check the order in the PayPal Sandbox dashboard.";}else{fetch("/api/paypal/capture/"+encodeURIComponent(token),{method:"POST"}).then(async r=>{const d=await r.json();if(!r.ok)throw new Error(d.detail||"Capture failed");out.textContent="PayPal Sandbox capture status: "+d.status;}).catch(e=>out.textContent="Capture could not be verified: "+e.message);}</script></body></html>
